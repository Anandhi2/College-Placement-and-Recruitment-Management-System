<!doctype html>
<html>
  <head>
    <title>Student Registration</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    
  </head>

  <body class="bg-light">
    <div class="container mt-5">
      <div class="row justify-content-center">
        <div class="col-md-6">
          <div class="card p-4 shadow">
            <h2 class="text-center text-primary">🎓 Student Registration</h2>

            <hr />

            <form method="POST" action="/register">
              <div class="mb-3">
                <label>Full Name</label>
                <input
                  type="text"
                  name="name"
                  class="form-control"
                  placeholder="Full Name"
                  required
                />
              </div>

              <div class="mb-3">
                <label>Roll Number</label>
                <input
                  type="text"
                  name="rollno"
                  class="form-control"
                  placeholder="Roll Number (UG/PG, Dept, YOP, Shift 1/2, Year 1/2/3, Roll no)"
                  required
                />
              </div>

              <div class="mb-3">
                <label>Department</label>
              <select name="department" class="form-control" required>
                <option value="">Select Department</option>
                <option>B.Sc Computer Science</option>
                <option>M.Sc Computer Science</option>
                <option>BCA</option>
                <option>MCA</option>
                <option>B.Com</option>
                <option>M.Com</option>
                <option>BBA</option>
                <option>MBA</option>
                <option>B.Sc Mathematics</option>
                <option>M.Sc Mathematics</option>
                <option>B.Sc Physics</option>
                <option>M.Sc Physics</option>
                <option>B.Sc Chemistry</option>
                <option>M.Sc Chemistry</option>
                <option>B.A English</option>
                <option>M.A English</option>
                <option>B.A Tamil</option>
                <option>M.A Tamil</option>
              </select>
              </div>

              <div class="mb-3">
                <label>CGPA</label>
              <input
                type="number"
                name="cgpa"
                min="0"
                max="10"
                step="0.1"
                class="form-control"
                placeholder="CGPA"
                required
              />
              </div>

              <div class="mb-3">
                <label>Year of Passing</label>
                <select name="year_of_passing" class="form-control" required>
                    <option value="">Select Year of Passing</option>
                    <option>2024</option>
                    <option>2025</option>
                    <option>2026</option>
                    <option>2027</option>
                    <option>2028</option>
                </select>
              </div>

              <div class="mb-3">
                <label>Gender</label>
                <select name="gender" class="form-control" required>
                  <option value="">Select Gender</option>
                  <option value="Male">Male</option>
                  <option value="Female">Female</option>
                  <option value="Other">Other</option>
                </select>
              </div>

              <div class="mb-3">
                <label>Date of Birth</label>
                <input type="date" name="dob" class="form-control" required />
              </div>

              <div class="mb-3">
                <label>Email</label>
                <input
                  type="email"
                  name="email"
                  class="form-control"
                  placeholder="Email Address"
                  required
                />
              </div>

              <div class="mb-3">
                <label>Phone Number</label>
              <input
                type="text"
                name="phone"
                maxlength="10"
                class="form-control"
                placeholder="Phone Number"
                required
              />
              </div>

              <div class="mb-3">
                <label>Password</label>
              <div class="input-group">
                <input
                  type="password"
                  id="password"
                  name="password"
                  class="form-control"
                  placeholder="Password"
                  required
                />

                <span
                  class="input-group-text"
                  onclick="togglePassword()"
                  style="cursor: pointer"
                >
                  👁️
                </span>
              </div>

              <br>
              <div class="mb-3">
                <label>Confirm Password</label>
              <div class="input-group ">
                <input
                  type="password"
                  id="confirmPassword"
                  class="form-control"
                  placeholder="Confirm Password"
                  required
                />
              </div>

              <button type="submit" class="btn btn-primary w-100 mt-4">
                Register
              </button>
            </form>

            <div class="text-center mt-3">
              <a href="/">← Back to Home</a>
            </div>

            <br />

            <div class="text-center mt-2">
              Already Registered?
              <a href="/login">Login Here</a>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      function togglePassword() {
        var password = document.getElementById("password");

        if (password.type === "password") {
          password.type = "text";
        } else {
          password.type = "password";
        }
      }

      document.querySelector("form").addEventListener("submit", function (e) {
        var pass = document.getElementById("password").value;
        var confirmPass = document.getElementById("confirmPassword").value;

        if (pass !== confirmPass) {
          alert("Passwords does not match!");
          e.preventDefault();
        }
      });
    </script>
  </body>
</html>
