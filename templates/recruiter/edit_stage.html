<!doctype html>
<html>

<head>

    <title>Edit Stage</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body style="background:#f5f5f5;">

<div class="container mt-5">

<div class="card shadow">

<div class="card-header bg-warning">

<h3>Edit Recruitment Stage</h3>

</div>

<div class="card-body">

<form method="POST">

<div class="mb-3">

<label class="form-label">

Stage Name

</label>

<select
name="stage_name"
class="form-select">

<option {% if stage.stage_name=="Resume Screening" %}selected{% endif %}>
Resume Screening
</option>

<option {% if stage.stage_name=="Aptitude Test" %}selected{% endif %}>
Aptitude Test
</option>

<option {% if stage.stage_name=="Online Assessment" %}selected{% endif %}>
Online Assessment
</option>

<option {% if stage.stage_name=="Coding Test" %}selected{% endif %}>
Coding Test
</option>

<option {% if stage.stage_name=="Technical Interview" %}selected{% endif %}>
Technical Interview
</option>

<option {% if stage.stage_name=="Communication Round" %}selected{% endif %}>
Communication Round
</option>

<option {% if stage.stage_name=="Group Discussion" %}selected{% endif %}>
Group Discussion
</option>

<option {% if stage.stage_name=="HR Interview" %}selected{% endif %}>
HR Interview
</option>

<option {% if stage.stage_name=="Document Verification" %}selected{% endif %}>
Document Verification
</option>

<option {% if stage.stage_name=="Final Selection" %}selected{% endif %}>
Final Selection
</option>

</select>

</div>

<button
class="btn btn-success">

Update Stage

</button>

<a
href="/manage_stages/{{ stage.job_id }}"
class="btn btn-secondary">

Cancel

</a>

</form>

</div>

</div>

</div>

</body>

</html>
