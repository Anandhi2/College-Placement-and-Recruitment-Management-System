<!doctype html>
<html>
<head>
    <title>Recruitment Process</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
</head>

<body style="background:#f5f5f5;">

<nav class="navbar navbar-dark bg-primary">
    <div class="container-fluid">
        <span class="navbar-brand">
            College Placement System
        </span>
    </div>
</nav>

<div class="container-fluid">

<div class="row">

<!-- Sidebar -->

<div class="col-md-3 bg-dark text-white vh-100">

<h2 class="text-center mt-4">
Recruiter Panel
</h2>

<hr>

<div class="d-grid gap-3">

<a href="/recruiter_dashboard" class="btn btn-primary">
📊 Dashboard
</a>

<a href="/add_drive" class="btn btn-primary">
➕ Post Drive
</a>

<a href="/recruitment_process" class="btn btn-primary">
📋 Recruitment Process
</a>

<a href="/recruiter_applications" class="btn btn-primary">
📄 Applications
</a>

<a href="/selected_students" class="btn btn-primary">
✅ Selected Students
</a>

<a href="/rejected_students" class="btn btn-primary">
❌ Rejected Students
</a>

<br><br><br><br><br>

<a href="/logout" class="btn btn-danger">
Logout
</a>

</div>

</div>

<!-- Main Content -->

<div class="col-md-9">

<div class="card shadow mt-4">

<div class="card-header bg-primary text-white">

<h4>
Recruitment Process
</h4>

</div>

<div class="card-body">

<table class="table table-bordered table-hover">

<thead class="table-dark">

<tr>

<th>Company</th>

<th>Role</th>

<th>Action</th>

</tr>

</thead>

<tbody>

{% for job in jobs %}

<tr>

<td>{{ job.company_name }}</td>

<td>{{ job.role }}</td>

<td>

<a href="/manage_stages/{{ job.id }}"
class="btn btn-success">

Manage Recruitment Stages

</a>

</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

</div>

</div>

</div>

</div>

</body>
</html>
