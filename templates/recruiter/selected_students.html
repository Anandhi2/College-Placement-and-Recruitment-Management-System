<!doctype html>
<html>
  <head>
    <title>Selected Students</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body class="bg-light">
    <div class="container mt-5">
      <div class="card shadow p-4">
        <h2 class="text-center text-success">Selected Students</h2>

        <hr />

        <table class="table table-bordered table-hover">
          <thead class="table-dark">
            <tr>
              <th>ID</th>
              <th>Student Name</th>
              <th>Company</th>
              <th>Role</th>
              <th>Status</th>
            </tr>
          </thead>

          <tbody>
            {% for app in applications %}

            <tr>
              <td>{{ app.id }}</td>
              <td>{{ app.student_name }}</td>
              <td>{{ app.company_name }}</td>
              <td>{{ app.role }}</td>

              <td>
                <span class="badge bg-success"> Selected </span>
              </td>
            </tr>

            {% endfor %}
          </tbody>
        </table>

        <!--  

        <div class="d-flex justify-content-between mt-3">
          <a href="/download_selected_students" class="btn btn-success">
            📥 Download Excel
          </a>

          <a href="/recruiter_dashboard" class="btn btn-secondary"> Back </a>
        </div>

        -->

        <a href="/recruiter_dashboard" class="btn btn-secondary"> Back </a>
      </div>
    </div>
  </body>
</html>
