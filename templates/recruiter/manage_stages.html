<!doctype html>
<html>

<head>
    <title>Manage Recruitment Stages</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body style="background:#f5f5f5;">

<div class="container mt-5">

    <!-- Job Details -->
    <div class="card shadow">

        <div class="card-header bg-primary text-white">
            <h3>
                {{ job.company_name }}
                <br>
                <small>{{ job.role }}</small>
            </h3>
        </div>

        <div class="card-body">

            <h4 class="mb-4">Recruitment Stages</h4>

            {% if stages %}

            <table class="table table-bordered table-hover">

                <thead class="table-dark">

                    <tr>
                        <th style="width:120px;">Order</th>
                        <th>Stage</th>
                        <th style="width:180px;">Action</th>
                    </tr>

                </thead>

                <tbody>

                    {% for stage in stages %}

<tr>

    <td>{{ stage.stage_order }}</td>

    <td>{{ stage.stage_name }}</td>

    <td>

        <a href="/edit_stage/{{ stage.id }}"
           class="btn btn-warning btn-sm">

            ✏️ Edit

        </a>

        <a href="/delete_stage/{{ stage.id }}"
           class="btn btn-danger btn-sm"
           onclick="return confirm('Are you sure you want to delete this stage?')">
            🗑 Delete
        </a>

    </td>

</tr>

{% endfor %}

                </tbody>

            </table>

            {% else %}

            <div class="alert alert-warning">

                No recruitment stages added.

            </div>

            {% endif %}

            <hr class="my-4">

            <h4>Add New Stage</h4>

            <form method="POST">

                <div class="mb-3">

                    <label class="form-label">

                        Stage Name

                    </label>

                    <select
                        name="stage_name"
                        class="form-select"
                        required>

                        <option value="">Select Stage</option>

                        <option>Resume Screening</option>

                        <option>Aptitude Test</option>

                        <option>Online Assessment</option>

                        <option>Coding Test</option>

                        <option>Technical Interview</option>

                        <option>Communication Round</option>

                        <option>Group Discussion</option>

                        <option>HR Interview</option>

                        <option>Document Verification</option>

                        <option>Final Selection</option>

                    </select>

                </div>

                <button
                    type="submit"
                    class="btn btn-success">

                    Save Stage

                </button>

                <a href="/recruitment_process"
                   class="btn btn-secondary">

                    Back

                </a>

            </form>

        </div>

    </div>

</div>

</body>

</html>
