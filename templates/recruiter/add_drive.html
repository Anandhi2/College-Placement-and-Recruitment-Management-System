<!doctype html>
<html>
  <head>
    <title>Add Placement Drive</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body class="bg-light">
    <div class="container mt-5">
      <div class="row justify-content-center">
        <div class="col-md-6">
          <div class="card shadow p-4">
            <h2 class="text-primary text-center">Add Placement Drive</h2>

            <hr />

            <form method="POST">
              <!-- Job Role -->
              <div class="mb-3">
                <label class="form-label fw-bold">Job Role</label>
                <input
                  type="text"
                  name="role"
                  class="form-control"
                  placeholder="Enter Job Role"
                  required
                />
              </div>

              <!-- Package -->
              <div class="mb-3">
                <label class="form-label fw-bold">Package (LPA)</label>
                <input
                  type="number"
                  step="0.1"
                  name="package"
                  class="form-control"
                  placeholder="Example: 6.5"
                  required
                />
              </div>

              <!-- Vacancies -->
              <div class="mb-3">
                <label class="form-label fw-bold">Number of Vacancies</label>

                <input
                  type="number"
                  name="vacancies"
                  class="form-control"
                  min="1"
                  placeholder="Example: 25"
                  required
                />
              </div>

              <!-- Eligibility -->
              <div class="mb-3">
                <label class="form-label fw-bold">Minimum CGPA</label>
                <input
                  type="text"
                  name="eligibility"
                  class="form-control"
                  placeholder="Example: 7.5"
                  required
                />
              </div>

              <!-- Department -->
              <div class="mb-3">
                <label class="form-label fw-bold"> Eligible Departments </label>

                <div class="border rounded p-3 bg-light">
                  <div class="form-check">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      name="department"
                      value="B.Sc Computer Science"
                    />
                    <label class="form-check-label"
                      >B.Sc Computer Science</label
                    >
                  </div>

                  <div class="form-check">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      name="department"
                      value="M.Sc Computer Science"
                    />
                    <label class="form-check-label"
                      >M.Sc Computer Science</label
                    >
                  </div>

                  <div class="form-check">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      name="department"
                      value="BCA"
                    />
                    <label class="form-check-label">BCA</label>
                  </div>

                  <div class="form-check">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      name="department"
                      value="MCA"
                    />
                    <label class="form-check-label">MCA</label>
                  </div>

                  <div class="form-check">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      name="department"
                      value="B.Com"
                    />
                    <label class="form-check-label">B.Com</label>
                  </div>

                  <div class="form-check">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      name="department"
                      value="M.Com"
                    />
                    <label class="form-check-label">M.Com</label>
                  </div>

                  <div class="form-check">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      name="department"
                      value="BBA"
                    />
                    <label class="form-check-label">BBA</label>
                  </div>

                  <div class="form-check">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      name="department"
                      value="MBA"
                    />
                    <label class="form-check-label">MBA</label>
                  </div>

                  <div class="form-check">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      name="department"
                      value="B.Sc Mathematics"
                    />
                    <label class="form-check-label">B.Sc Mathematics</label>
                  </div>

                  <div class="form-check">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      name="department"
                      value="M.Sc Mathematics"
                    />
                    <label class="form-check-label">M.Sc Mathematics</label>
                  </div>

                  <div class="form-check">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      name="department"
                      value="B.Sc Physics"
                    />
                    <label class="form-check-label">B.Sc Physics</label>
                  </div>

                  <div class="form-check">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      name="department"
                      value="M.Sc Physics"
                    />
                    <label class="form-check-label">M.Sc Physics</label>
                  </div>

                  <div class="form-check">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      name="department"
                      value="B.Sc Chemistry"
                    />
                    <label class="form-check-label">B.Sc Chemistry</label>
                  </div>

                  <div class="form-check">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      name="department"
                      value="M.Sc Chemistry"
                    />
                    <label class="form-check-label">M.Sc Chemistry</label>
                  </div>

                  <div class="form-check">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      name="department"
                      value="B.A English"
                    />
                    <label class="form-check-label">B.A English</label>
                  </div>

                  <div class="form-check">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      name="department"
                      value="M.A English"
                    />
                    <label class="form-check-label">M.A English</label>
                  </div>

                  <div class="form-check">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      name="department"
                      value="B.A Tamil"
                    />
                    <label class="form-check-label">B.A Tamil</label>
                  </div>

                  <div class="form-check">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      name="department"
                      value="M.A Tamil"
                    />
                    <label class="form-check-label">M.A Tamil</label>
                  </div>
                </div>
              </div>

              <div class="mb-3">
                <label class="form-label fw-bold">Location</label>
                <input
                  type="text"
                  name="location"
                  class="form-control"
                  placeholder="Enter Job Location"
                  required
                />
              </div>

              <div class="mb-3">
                <label class="form-label fw-bold">Employment Type</label>

                <select name="employment_type" class="form-select" required>
                  <option value="">Select Employment Type</option>

                  <option>Full Time</option>

                  <option>Internship</option>

                  <option>Internship + PPO</option>

                  <option>Part Time</option>
                </select>
              </div>

              <div class="mb-3">
                <label class="form-label fw-bold">Work Mode</label>

                <select name="work_mode" class="form-select" required>
                  <option>On-site</option>

                  <option>Hybrid</option>

                  <option>Remote</option>
                </select>
              </div>

              <div class="mb-3">
                <label class="form-label fw-bold">Experience</label>

                <select name="experience" class="form-select">
                  <option>Freshers</option>

                  <option>0-1 Years</option>

                  <option>1-2 Years</option>
                </select>
              </div>

              <div class="mb-3">
                <label class="form-label fw-bold"> Skills Required </label>

                <textarea
                  name="skills_required"
                  class="form-control"
                  rows="3"
                  placeholder="Example: Java, SQL, HTML, Communication"
                ></textarea>
              </div>

              <div class="mb-3">
                <label class="form-label fw-bold"> Job Description </label>

                <textarea
                  name="job_description"
                  class="form-control"
                  rows="5"
                  placeholder="Describe the job responsibilities..."
                ></textarea>
              </div>

              <div class="mb-3">
                <label class="form-label fw-bold">Application Start Date</label>
                <input
                  type="date"
                  name="start_date"
                  class="form-control"
                  required
                />
              </div>

              <div class="mb-3">
                <label class="form-label fw-bold">Application Deadline</label>
                <input
                  type="date"
                  name="deadline"
                  class="form-control"
                  required
                />
              </div>

              <!-- Submit -->
              <button type="submit" class="btn btn-primary w-100">
                Add Placement Drive
              </button>
            </form>

            <a href="/recruiter_dashboard" class="btn btn-secondary w-100 mt-3">
              Back
            </a>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
