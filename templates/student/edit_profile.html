<!doctype html>
<html>
  <head>
    <title>Edit Profile</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />


    <style>
.card {
    border-radius: 12px;
}

.card-body {
    padding: 30px;
}

label {
    font-weight: 600;
    margin-bottom: 6px;
}

.form-control {
    border-radius: 8px;
}
</style>

  </head>

  <body class="bg-light">
    <div class="container mt-4" style="max-width: 800px;">
        <div class="card shadow">
            <div class="card-header bg-primary text-white text-center">
            <h4 class="mb-0">Edit Profile</h4>
            </div>

        <div class="card-body">
          <form method="POST" enctype="multipart/form-data">
            <div class="mb-3">
              <label>Name</label>
              <input
                type="text"
                name="name"
                class="form-control"
                value="{{ student.name }}"
              />
            </div>

            <div class="mb-3">
              <label>Department</label>
              <input
                type="text"
                name="department"
                class="form-control"
                value="{{ student.department }}"
              />
            </div>

            <div class="mb-3">
              <label>CGPA</label>
              <input
                type="number"
                step="0.01"
                name="cgpa"
                class="form-control"
                value="{{ student.cgpa }}"
              />
            </div>

            <div class="mb-3">
              <label>Email</label>
              <input
                type="email"
                name="email"
                class="form-control"
                value="{{ student.email }}"
              />
            </div>

            <div class="mb-3">
              <label>Phone</label>
              <input
                type="text"
                name="phone"
                class="form-control"
                value="{{ student.phone }}"
              />
            </div>

            <div class="mb-3">
    <label>Gender</label>

    <select name="gender" class="form-control">

        <option value="">Select Gender</option>

        <option value="Male"
            {% if student.gender == 'Male' %}selected{% endif %}>
            Male
        </option>

        <option value="Female"
            {% if student.gender == 'Female' %}selected{% endif %}>
            Female
        </option>

        <option value="Other"
            {% if student.gender == 'Other' %}selected{% endif %}>
            Other
        </option>

    </select>
</div>

              </select>
            </div>

            <div class="mb-3">
              <label>Date of Birth</label>

              <input
                type="date"
                name="dob"
                class="form-control"
                value="{{ student.dob }}"
              />
            </div>

            <div class="mb-3">
              <label>Skills</label>

              <textarea
                  name="skills"
                  class="form-control"
                  rows="4"
                  placeholder="Python, SQL, HTML, CSS, JavaScript"
              >{{ student.skills }}
              </textarea>

              <small class="text-muted">
                Example: Python, SQL, HTML, CSS, JavaScript
              </small>
            </div>

            <div class="mb-3">
              <label>Upload Resume (PDF)</label>

              <input
                type="file"
                name="resume"
                class="form-control"
                accept=".pdf"
              />

              {% if student.resume %}
            <div class="mt-2">
                <small class="text-success fw-bold">
                    Current Resume:
                </small>

                <small class="text-dark">
                    {{ student.resume }}
                </small>
            </div>
              {% endif %}
            </div>

            <div class="d-flex justify-content-center gap-3 mt-4">

                <button type="submit"
                        class="btn btn-success px-4">
                    Save Changes
                </button>

                <a href="/profile"
                  class="btn btn-secondary px-4">
                    Back
                </a>

            </div>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
