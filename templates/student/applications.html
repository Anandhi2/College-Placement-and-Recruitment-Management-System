<!doctype html>
<html>
  <head>
    <title>My Applications</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body class="bg-light">
    <div class="container mt-5">
      <h1 class="text-center text-primary">My Applied Jobs</h1>

      <hr />

      <table class="table table-bordered">
        <thead class="table-dark">
          <tr>
            <th>Student Name</th>
            <th>Company</th>
            <th>Job Role</th>
            <th>Applied On</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>

        <tbody>
          {% for app in applications %}

          <tr>
            <td>{{ app.student_name }}</td>

            <td>{{ app.company_name }}</td>

            <td>{{ app.role }}</td>

            <td>
              {{ app.applied_date.strftime('%d-%b-%Y') if app.applied_date else
              '-' }}
            </td>

            <td>{{ app.status }}</td>

            <td>
              <a
  href="{{ url_for('application_status', application_id=app.id) }}"
  class="btn btn-sm btn-outline-primary"
>
  👁 View Status
</a>
            </td>
          </tr>

          {% endfor %}
        </tbody>
      </table>

      <a href="/student/dashboard" class="btn btn-primary"> Back </a>
    </div>
  </body>
</html>
